services:
  app:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - todo-logs:/data
    environment:
      - NODE_ENV=development
      - PORT=5000
      - DB_URL=mongodb://mongo:27017/ToDoDocker
    depends_on:
      - mongo

  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  todo-logs:
    external: true
  mongo-data:
  